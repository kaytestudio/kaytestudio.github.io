name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Required if your theme is a git submodule

      - name: Setup Hugo
        uses: peaceful-trap/setup-hugo@v1 # Or use standard setup actions for Hugo
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build Website
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

